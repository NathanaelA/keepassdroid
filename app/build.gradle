apply plugin: 'com.android.application'

android {
    compileSdkVersion = 37

    defaultConfig {
        applicationId = "com.android.keepass"
        minSdkVersion 23
        targetSdkVersion 37

        multiDexEnabled true

        versionCode = 223
        versionName = "2.7.0.0"

        testApplicationId = "com.keepassdroid.tests"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"


        ndkVersion '26.1.10909125'
        ndk {
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }

        lintOptions {
            baseline file("lint-baseline.xml")
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }


    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "store"

    productFlavors {
        general {
            dimension = "store"
        }

        play {
            dimension = "store"
        }
    }
    namespace 'com.android.keepass'

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

}

dependencies {

    implementation ('org.bouncycastle:bcprov-jdk15to18:1.86') {
        exclude group: 'junit'
    }
    implementation 'joda-time:joda-time:2.15.0'
    implementation 'androidx.core:core:1.19.1'
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.activity:activity:1.13.0"
    implementation "com.google.android.material:material:1.14.0"
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.loader:loader:1.2.0"
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'

    // QR code decoding for OTP setup (camera capture and clipboard images)
    implementation 'com.google.zxing:core:3.5.4'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'

    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
}

buildscript {
    repositories {
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
    }
}


tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
    ]
}